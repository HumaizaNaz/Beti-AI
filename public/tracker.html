<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beti AI — Live Emergency Beacon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Vector Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080a10;
      color: #f8fafc;
    }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .glass-card {
      background: rgba(13, 17, 27, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pulse-ring {
      border: 3px solid #ef4444;
      border-radius: 50%;
      height: 36px;
      width: 36px;
      position: absolute;
      left: -6px;
      top: -6px;
      animation: pulsate 1.8s ease-out infinite;
      opacity: 0;
    }
    @keyframes pulsate {
      0% { transform: scale(0.1, 0.1); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1.6, 1.6); opacity: 0; }
    }
    .pulse-dot {
      background: #ef4444;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      height: 24px;
      width: 24px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden relative flex flex-col justify-between">

  <!-- Fullscreen Interactive Map Canvas -->
  <div id="map" class="absolute inset-0 z-0"></div>

  <!-- 🌟 Top Floating Navigation & Incident Status Bar -->
  <header class="relative z-10 p-4 md:p-6 max-w-6xl w-full mx-auto flex items-center justify-between pointer-events-none">
    
    <!-- Left: Status Pill -->
    <div class="glass-card px-4 py-2.5 rounded-2xl flex items-center gap-3 pointer-events-auto shadow-2xl">
      <div class="w-3 h-3 rounded-full bg-red-500 animate-ping"></div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-bold text-red-400 uppercase tracking-wider flex items-center gap-1">
            <i data-lucide="radio" class="w-3 h-3 text-red-400"></i> Live SOS Incident
          </span>
          <span class="text-[10px] text-slate-400">• Just now</span>
        </div>
        <h1 class="text-sm font-bold text-white font-display">Ayesha (+92 300 1234567)</h1>
      </div>
    </div>

    <!-- Right: Quick Direct Call 15 Police Button -->
    <div class="flex items-center gap-2.5 pointer-events-auto">
      <a href="tel:15" class="px-5 py-2.5 rounded-2xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-xl shadow-red-600/30 transition-all flex items-center gap-2">
        <i data-lucide="phone-call" class="w-3.5 h-3.5"></i> Call Police (15)
      </a>
      <a href="/" class="glass-card px-4 py-2.5 rounded-2xl text-xs font-medium text-slate-300 hover:text-white hover:bg-white/[0.08] transition-all flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Hub
      </a>
    </div>

  </header>

  <!-- 🌟 Bottom Floating Telemetry & Evidence Sheet -->
  <footer class="relative z-10 p-4 md:p-6 max-w-6xl w-full mx-auto pointer-events-none">
    
    <div class="glass-card rounded-3xl p-5 md:p-6 shadow-2xl pointer-events-auto border border-white/[0.08] grid md:grid-cols-12 gap-6 items-center">
      
      <!-- Incident Details (5 Cols) -->
      <div class="md:col-span-5 space-y-2">
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-semibold text-rose-400 uppercase tracking-wider flex items-center gap-1">
            <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Trigger Reason
          </span>
        </div>
        <p class="text-xs font-medium text-slate-200 bg-red-500/10 border border-red-500/20 p-2.5 rounded-xl">
          Secret phrase detected: "bhaiya late ho raha hai"
        </p>
        <div class="flex items-center gap-4 text-xs text-slate-400 pt-1">
          <span class="flex items-center gap-1"><i data-lucide="car" class="w-3 h-3 text-slate-400"></i> BK-9988 (Careem)</span>
          <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3 text-slate-400"></i> Clifton</span>
        </div>
      </div>

      <!-- Live Location Details (4 Cols) -->
      <div class="md:col-span-4 space-y-1.5 border-t md:border-t-0 md:border-l border-white/[0.08] md:pl-6 pt-3 md:pt-0">
        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Estimated Address:</span>
        <p class="text-xs text-white font-medium leading-relaxed">
          Shahrah-e-Faisal, near FTC Building, Karachi
        </p>
        <span class="text-[11px] text-emerald-400 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> GPS Accuracy: 5 meters
        </span>
      </div>

      <!-- Quick Action / Safe Disarm (3 Cols) -->
      <div class="md:col-span-3 flex flex-col gap-2 border-t md:border-t-0 md:border-l border-white/[0.08] md:pl-6 pt-3 md:pt-0">
        <button onclick="shareLink()" class="w-full py-2.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-xs font-semibold text-slate-200 border border-white/[0.08] transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Copy GPS Link
        </button>
        <button onclick="disarmPrompt()" class="w-full py-2 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-xs font-semibold text-emerald-300 border border-emerald-500/30 transition-all">
          Disarm with PIN (1234)
        </button>
      </div>

    </div>

  </footer>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Initialize Leaflet Map
    const lat = 24.8607;
    const lng = 67.0011;
    const map = L.map('map', { zoomControl: false }).setView([lat, lng], 15);

    // Ultra-Clean Dark Matter Tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CartoDB &copy; OSM',
      maxZoom: 19
    }).addTo(map);

    // Custom Glowing Red Beacon Marker
    const pulseIcon = L.divIcon({
      className: 'relative',
      html: `
        <div class="relative">
          <div class="pulse-ring"></div>
          <div class="pulse-dot"></div>
        </div>
      `,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    const marker = L.marker([lat, lng], { icon: pulseIcon }).addTo(map);
    marker.bindPopup(`
      <div style="color: #0f172a; font-family: sans-serif; font-size: 11px; padding: 4px;">
        <b style="color: #ef4444;">🚨 Active SOS Incident</b><br>
        Ayesha (+92 300 1234567)<br>
        Ride: Careem (BK-9988)<br>
        Speed: 28 km/h
      </div>
    `).openPopup();

    function shareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('📋 Live Incident GPS Link copied to clipboard!');
    }

    function disarmPrompt() {
      const pin = prompt('Enter 4-Digit Safe PIN to disarm:');
      if (pin === '1234') {
        alert('✅ Emergency Incident resolved safely.');
        window.location.href = '/';
      } else if (pin) {
        alert('❌ Invalid PIN. Tracking remains active.');
      }
    }
  </script>
</body>
</html>
